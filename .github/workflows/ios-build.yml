name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compile SabiasQue
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS application
        run: |
          xcodebuild \
            -project SabiasQue.xcodeproj \
            -target SabiasQue \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload compiled application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SabiasQue-iOS-Build
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/SabiasQue.app
          if-no-files-found: error
