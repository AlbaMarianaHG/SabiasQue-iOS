name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compile and Capture SabiasQue
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS application
        run: |
          xcodebuild \
            -project SabiasQue.xcodeproj \
            -target SabiasQue \
            -sdk iphonesimulator \
            -configuration Debug \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [
              d for runtime, items in data["devices"].items()
              for d in items
              if d["isAvailable"] and d["name"].startswith("iPhone")
          ]
          print(devices[0]["udid"] if devices else "")
          ')

          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator available."
            exit 1
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install application
        run: |
          xcrun simctl install \
            "$DEVICE_ID" \
            "$RUNNER_TEMP/build/SabiasQue.app"

      - name: Capture all five screens
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"

          capture_screen() {
            NAME="$1"
            SCREEN="$2"

            echo "Capturing: $NAME"

            xcrun simctl launch \
              --terminate-running-process \
              "$DEVICE_ID" \
              com.alba.SabiasQue \
              --capture-screen "$SCREEN"

            sleep 3

            xcrun simctl io "$DEVICE_ID" screenshot \
              "$RUNNER_TEMP/screenshots/$NAME.png"
          }

          capture_screen "01-bienvenida" "welcome"
          capture_screen "02-categorias" "categories"
          capture_screen "03-deportes-barcelona" "sports"
          capture_screen "04-ciencia-naturaleza" "science"
          capture_screen "05-tecnologia" "technology"

      - name: Upload compiled application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SabiasQue-iOS-Build
          path: ${{ runner.temp }}/build/SabiasQue.app
          if-no-files-found: error

      - name: Upload all screenshots in one ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SabiasQue-Screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
